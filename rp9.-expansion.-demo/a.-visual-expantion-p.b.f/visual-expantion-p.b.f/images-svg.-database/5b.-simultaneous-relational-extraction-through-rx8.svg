<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#334155"/></marker>
    <style>
      .title{font:700 38px Arial,sans-serif;fill:#0f172a}.sub{font:20px Arial,sans-serif;fill:#475569}.h{font:700 23px Arial,sans-serif;fill:#0f172a}.t{font:18px Arial,sans-serif;fill:#1e293b}.small{font:16px Arial,sans-serif;fill:#475569}.math{font:700 26px Arial,sans-serif;fill:#0f172a}.panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.line{stroke:#334155;stroke-width:3;fill:none}.q1{fill:#5eead4}.q2{fill:#60a5fa}.q3{fill:#fbbf24}.q4{fill:#fb7185}.violet{fill:#c4b5fd}.bracket{stroke:#334155;stroke-width:3;fill:none}.white{fill:#fff}
    </style>
  </defs>
  <rect width="1600" height="1100" fill="#fff"/>
  <text x="800" y="58" text-anchor="middle" class="title">5B. SIMULTANEOUS RELATIONAL EXTRACTION THROUGH Rx8</text>
  <text x="800" y="92" text-anchor="middle" class="sub">One complete reference field · multiple compatible readings · no new originating relation</text>

  <!-- master bar -->
  <rect x="90" y="135" width="1420" height="340" rx="18" class="panel"/>
  <text x="800" y="180" text-anchor="middle" class="h">ONE Rx8 FIELD = EIGHT EQUAL REFERENCE POSITIONS</text>
  <g transform="translate(160 225)">
    <rect width="160" height="92" class="q1"/><rect x="160" width="160" height="92" class="q1"/>
    <rect x="320" width="160" height="92" class="q2"/><rect x="480" width="160" height="92" class="q2"/>
    <rect x="640" width="160" height="92" class="q3"/><rect x="800" width="160" height="92" class="q3"/>
    <rect x="960" width="160" height="92" class="q4"/><rect x="1120" width="160" height="92" class="q4"/>
    <rect width="1280" height="92" fill="none" stroke="#0f172a" stroke-width="4"/>
    <g class="math" text-anchor="middle"><text x="80" y="39">1</text><text x="240" y="39">2</text><text x="400" y="39">3</text><text x="560" y="39">4</text><text x="720" y="39">5</text><text x="880" y="39">6</text><text x="1040" y="39">7</text><text x="1200" y="39">8</text></g>
    <g class="small" text-anchor="middle"><text x="80" y="72">12.5%</text><text x="240" y="72">25%</text><text x="400" y="72">37.5%</text><text x="560" y="72">50%</text><text x="720" y="72">62.5%</text><text x="880" y="72">75%</text><text x="1040" y="72">87.5%</text><text x="1200" y="72">100%</text></g>
  </g>
  <!-- cumulative brackets -->
  <path d="M160 342 v18 h160 v-18" class="bracket"/><text x="240" y="390" text-anchor="middle" class="t">1/8</text>
  <path d="M160 405 v18 h320 v-18" class="bracket"/><text x="320" y="454" text-anchor="middle" class="t">2/8 = 1/4</text>
  <path d="M800 327 v38" class="bracket"/><text x="800" y="390" text-anchor="middle" class="t">4/8 = 1/2</text>
  <path d="M160 405 v18 h960 v-18" class="bracket"/><text x="1000" y="454" text-anchor="middle" class="t">6/8 = 3/4</text>
  <path d="M1440 327 v38" class="bracket"/><text x="1380" y="390" text-anchor="middle" class="t">8/8 = 1</text>

  <!-- three layers -->
  <rect x="90" y="515" width="440" height="400" rx="18" class="panel"/>
  <text x="310" y="558" text-anchor="middle" class="h">RELATION</text>
  <circle cx="310" cy="700" r="115" fill="#e0f2fe" stroke="#0284c7" stroke-width="6"/>
  <circle cx="310" cy="700" r="8" fill="#7c3aed"/>
  <line x1="310" y1="700" x2="410" y2="643" stroke="#7c3aed" stroke-width="5"/>
  <text x="310" y="846" text-anchor="middle" class="math">1/3 ↔ 2/3</text>
  <text x="310" y="881" text-anchor="middle" class="small">continuous circular distinction</text>

  <path d="M550 714 H610" class="line" marker-end="url(#arrow)"/>

  <rect x="630" y="515" width="440" height="400" rx="18" class="panel"/>
  <text x="850" y="558" text-anchor="middle" class="h">REPRESENTATION</text>
  <rect x="725" y="615" width="250" height="170" class="white" stroke="#0f172a" stroke-width="5"/>
  <line x1="787.5" y1="615" x2="787.5" y2="785" stroke="#0f172a" stroke-width="3"/>
  <rect x="725" y="615" width="62.5" height="170" class="q1" opacity=".75"/>
  <rect x="787.5" y="615" width="187.5" height="170" class="q3" opacity=".55"/>
  <text x="756" y="707" text-anchor="middle" class="math">1/4</text>
  <text x="881" y="707" text-anchor="middle" class="math">3/4</text>
  <text x="850" y="846" text-anchor="middle" class="math">1/4 ↔ 3/4</text>
  <text x="850" y="881" text-anchor="middle" class="small">first measurable linear projection</text>

  <path d="M1090 714 H1150" class="line" marker-end="url(#arrow)"/>

  <rect x="1170" y="515" width="340" height="400" rx="18" class="panel"/>
  <text x="1340" y="558" text-anchor="middle" class="h">Rx8 PROJECTION</text>
  <g transform="translate(1218 633)">
    <rect width="30" height="135" class="q1"/><rect x="30" width="30" height="135" class="q1"/>
    <rect x="60" width="30" height="135" class="q3"/><rect x="90" width="30" height="135" class="q3"/><rect x="120" width="30" height="135" class="q3"/><rect x="150" width="30" height="135" class="q3"/>
    <rect x="180" width="30" height="135" fill="#e2e8f0"/><rect x="210" width="30" height="135" fill="#e2e8f0"/>
    <rect width="240" height="135" fill="none" stroke="#0f172a" stroke-width="4"/>
  </g>
  <text x="1340" y="816" text-anchor="middle" class="math">2/8 ↔ 6/8</text>
  <text x="1340" y="850" text-anchor="middle" class="t">25% ↔ 75%</text>
  <text x="1340" y="881" text-anchor="middle" class="small">same measurable identity</text>

  <!-- identity strip -->
  <rect x="150" y="958" width="1300" height="83" rx="15" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
  <text x="800" y="993" text-anchor="middle" class="math">1/4 = 2/8 = 25%   ·   1/2 = 4/8 = 50%   ·   3/4 = 6/8 = 75%   ·   1 = 8/8 = 100%</text>
  <text x="800" y="1026" text-anchor="middle" class="small">Different scales and groupings preserve the same relational identity.</text>
  <text x="800" y="1080" text-anchor="middle" class="sub">ONE CONSTRUCTION → MULTIPLE READINGS → ONE PRESERVED RELATION</text>
</svg>
