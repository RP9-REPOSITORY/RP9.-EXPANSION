<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">4B. Recursive Cubic Expansion P.B.F.</title>
  <desc id="description">The established 4A cubic field is shown at three scale levels: one cube, a two-by-two-by-two partition containing eight cubic subfields, and a three-by-three-by-three partition containing twenty-seven cubic subfields. Every subfield inherits the same local six-pyramid center structure without redrawing it.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eaf2fb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9" result="blur"/>
      <feOffset in="blur" dx="0" dy="7" result="offsetBlur"/>
      <feColorMatrix in="offsetBlur" type="matrix" values="0 0 0 0 0.075  0 0 0 0 0.14  0 0 0 0 0.23  0 0 0 0.16 0" result="shadowColor"/>
      <feMerge><feMergeNode in="shadowColor"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#244768"/>
    </marker>
    <style>
      .title { font: 700 42px Inter, Arial, sans-serif; fill: #13243a; letter-spacing: 1px; }
      .subtitle { font: 500 21px Inter, Arial, sans-serif; fill: #49657f; }
      .stage { font: 700 18px Inter, Arial, sans-serif; fill: #49657f; letter-spacing: 1.5px; }
      .count { font: 800 34px Inter, Arial, sans-serif; fill: #13243a; }
      .equation { font: 800 23px Inter, Arial, sans-serif; fill: #244768; }
      .caption { font: 500 17px Inter, Arial, sans-serif; fill: #314e69; }
      .small { font: 600 15px Inter, Arial, sans-serif; fill: #49657f; }
      .formula { font: 800 24px Inter, Arial, sans-serif; fill: #13243a; letter-spacing: 0.8px; }
      .boundary { font: 700 16px Inter, Arial, sans-serif; fill: #244768; letter-spacing: 0.3px; }
      .centerLabel { font: 800 13px Inter, Arial, sans-serif; fill: #d65353; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <rect x="55" y="45" width="1490" height="810" rx="30" fill="#ffffff" stroke="#c8d8e8" stroke-width="2" filter="url(#shadow)"/>

  <text x="100" y="120" class="title">4B. RECURSIVE CUBIC EXPANSION P.B.F.</text>
  <text x="100" y="160" class="subtitle">One established cubic field · two illustrated scale expansions · one invariant local 4A structure</text>
  <line x1="100" y1="215" x2="1500" y2="215" stroke="#d8e4ef" stroke-width="2"/>

  <!-- STAGE 1: one cube. -->
  <text x="300" y="270" text-anchor="middle" class="stage">ESTABLISHED 4A FIELD</text>
  <g transform="translate(135 330)">
    <polygon points="40,0 220,50 280,100 100,50" fill="#c9edf4" opacity="0.55" stroke="#244768" stroke-width="5"/>
    <polygon points="100,50 280,100 280,280 100,230" fill="#dff5f8" opacity="0.42" stroke="#244768" stroke-width="5"/>
    <polygon points="40,0 100,50 100,230 40,180" fill="#edf7fb" opacity="0.65" stroke="#244768" stroke-width="5"/>
    <polygon points="40,0 220,50 220,230 40,180" fill="none" stroke="#7c96ad" stroke-width="4"/>
    <line x1="40" y1="0" x2="100" y2="50" stroke="#244768" stroke-width="5"/>
    <line x1="220" y1="50" x2="280" y2="100" stroke="#244768" stroke-width="5"/>
    <line x1="220" y1="230" x2="280" y2="280" stroke="#244768" stroke-width="5"/>
    <line x1="40" y1="180" x2="100" y2="230" stroke="#244768" stroke-width="5"/>
    <circle cx="160" cy="140" r="34" fill="#d65353" stroke="#ffffff" stroke-width="4"/>
    <text x="160" y="145" text-anchor="middle" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">4A</text>
  </g>
  <text x="300" y="650" text-anchor="middle" class="count">1 CUBE</text>
  <text x="300" y="680" text-anchor="middle" class="caption">Six-pyramid center relation established</text>

  <line x1="450" y1="470" x2="540" y2="470" stroke="#244768" stroke-width="7" marker-end="url(#arrow)"/>

  <!-- STAGE 2: 2 x 2 x 2 = 8. -->
  <text x="760" y="270" text-anchor="middle" class="stage">FIRST CUBIC SCALE EXPANSION</text>
  <g transform="translate(595 330)">
    <polygon points="40,0 220,50 280,100 100,50" fill="#c9edf4" opacity="0.55" stroke="#244768" stroke-width="5"/>
    <polygon points="100,50 280,100 280,280 100,230" fill="#dff5f8" opacity="0.42" stroke="#244768" stroke-width="5"/>
    <polygon points="40,0 100,50 100,230 40,180" fill="#edf7fb" opacity="0.65" stroke="#244768" stroke-width="5"/>
    <polygon points="40,0 220,50 220,230 40,180" fill="none" stroke="#7c96ad" stroke-width="4"/>
    <line x1="40" y1="0" x2="100" y2="50" stroke="#244768" stroke-width="5"/>
    <line x1="220" y1="50" x2="280" y2="100" stroke="#244768" stroke-width="5"/>
    <line x1="220" y1="230" x2="280" y2="280" stroke="#244768" stroke-width="5"/>
    <line x1="40" y1="180" x2="100" y2="230" stroke="#244768" stroke-width="5"/>

    <!-- Half divisions on front, left and top visible faces. -->
    <g stroke="#35b9cf" stroke-width="4" fill="none">
      <line x1="190" y1="75" x2="190" y2="255"/>
      <line x1="100" y1="140" x2="280" y2="190"/>
      <line x1="70" y1="25" x2="250" y2="75"/>
      <line x1="130" y1="25" x2="190" y2="75"/>
      <line x1="70" y1="25" x2="70" y2="205"/>
      <line x1="40" y1="90" x2="100" y2="140"/>
      <line x1="130" y1="25" x2="130" y2="205" stroke="#7c96ad" stroke-dasharray="7 6"/>
      <line x1="70" y1="115" x2="250" y2="165" stroke="#7c96ad" stroke-dasharray="7 6"/>
    </g>
    <circle cx="160" cy="140" r="15" fill="#d65353"/>
  </g>
  <text x="760" y="650" text-anchor="middle" class="count">8 SUBFIELDS</text>
  <text x="760" y="680" text-anchor="middle" class="equation">2 × 2 × 2 = 8</text>

  <line x1="910" y1="470" x2="1000" y2="470" stroke="#244768" stroke-width="7" marker-end="url(#arrow)"/>

  <!-- STAGE 3: 3 x 3 x 3 = 27. -->
  <text x="1230" y="270" text-anchor="middle" class="stage">SECOND CUBIC SCALE EXPANSION</text>
  <g transform="translate(1060 330)">
    <polygon points="40,0 220,50 280,100 100,50" fill="#c9edf4" opacity="0.55" stroke="#244768" stroke-width="5"/>
    <polygon points="100,50 280,100 280,280 100,230" fill="#dff5f8" opacity="0.42" stroke="#244768" stroke-width="5"/>
    <polygon points="40,0 100,50 100,230 40,180" fill="#edf7fb" opacity="0.65" stroke="#244768" stroke-width="5"/>
    <polygon points="40,0 220,50 220,230 40,180" fill="none" stroke="#7c96ad" stroke-width="4"/>
    <line x1="40" y1="0" x2="100" y2="50" stroke="#244768" stroke-width="5"/>
    <line x1="220" y1="50" x2="280" y2="100" stroke="#244768" stroke-width="5"/>
    <line x1="220" y1="230" x2="280" y2="280" stroke="#244768" stroke-width="5"/>
    <line x1="40" y1="180" x2="100" y2="230" stroke="#244768" stroke-width="5"/>

    <!-- Third divisions on the visible faces. -->
    <g stroke="#35b9cf" stroke-width="3.5" fill="none">
      <!-- front vertical and horizontal thirds -->
      <line x1="160" y1="66.7" x2="160" y2="246.7"/>
      <line x1="220" y1="83.3" x2="220" y2="263.3"/>
      <line x1="100" y1="110" x2="280" y2="160"/>
      <line x1="100" y1="170" x2="280" y2="220"/>
      <!-- top thirds -->
      <line x1="60" y1="16.7" x2="240" y2="66.7"/>
      <line x1="80" y1="33.3" x2="260" y2="83.3"/>
      <line x1="100" y1="16.7" x2="160" y2="66.7"/>
      <line x1="160" y1="33.3" x2="220" y2="83.3"/>
      <!-- left face thirds -->
      <line x1="60" y1="16.7" x2="60" y2="196.7"/>
      <line x1="80" y1="33.3" x2="80" y2="213.3"/>
      <line x1="40" y1="60" x2="100" y2="110"/>
      <line x1="40" y1="120" x2="100" y2="170"/>
    </g>

    <!-- Central subfield is indicated, not expanded internally. -->
    <polygon points="160,126.7 220,143.3 220,203.3 160,186.7" fill="#d65353" opacity="0.35" stroke="#d65353" stroke-width="3"/>
    <circle cx="190" cy="165" r="11" fill="#d65353"/>
    <text x="190" y="225" text-anchor="middle" class="centerLabel">CENTRAL 4A SUBFIELD</text>
  </g>
  <text x="1230" y="650" text-anchor="middle" class="count">27 SUBFIELDS</text>
  <text x="1230" y="680" text-anchor="middle" class="equation">3 × 3 × 3 = 27</text>

  <g transform="translate(260 725)">
    <rect width="1080" height="75" rx="18" fill="#f4f8fc" stroke="#bfd1e2" stroke-width="2"/>
    <text x="540" y="31" text-anchor="middle" class="formula">1  →  8  →  27  →  …  →  n³</text>
    <text x="540" y="57" text-anchor="middle" class="small">Each cubic subfield inherits the established local 4A six-pyramid center relation</text>
  </g>

  <line x1="100" y1="820" x2="1500" y2="820" stroke="#d8e4ef" stroke-width="2"/>
  <text x="800" y="848" text-anchor="middle" class="boundary">THE SVG SHOWS THE SCALE EXCHANGE ONLY · THE ALREADY ESTABLISHED INTERNAL PYRAMID STRUCTURE IS NOT REDRAWN IN EVERY SUBFIELD</text>
</svg>
