<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <defs>
    <marker id="rArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#7c3aed"/></marker>
    <style>
      .title{font:700 38px Arial,sans-serif;fill:#0f172a}.sub{font:20px Arial,sans-serif;fill:#475569}.h{font:700 23px Arial,sans-serif;fill:#0f172a}.t{font:18px Arial,sans-serif;fill:#1e293b}.small{font:16px Arial,sans-serif;fill:#475569}.math{font:700 26px Arial,sans-serif;fill:#0f172a}.panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.shape{stroke:#0f172a;stroke-width:5;fill:none}.inner{stroke:#0f172a;stroke-width:3;fill:none}.guide{stroke:#64748b;stroke-width:2;stroke-dasharray:7 7}.xfill{fill:#5eead4}.yfill{fill:#fbbf24}.eighth{fill:#fde68a}.center{fill:#7c3aed}.lock{fill:#ede9fe;stroke:#7c3aed;stroke-width:3}.teal{fill:#0f766e}.gold{fill:#a16207}.arrow{stroke:#334155;stroke-width:3;fill:none}.bracket{stroke:#334155;stroke-width:3;fill:none}
    </style>
    <clipPath id="circleClip"><circle cx="425" cy="500" r="260"/></clipPath>
  </defs>
  <rect width="1600" height="1100" fill="#fff"/>
  <text x="800" y="58" text-anchor="middle" class="title">5D. P.B.F. QUOTIENT AND SIX-POSITION EXPANSION</text>
  <text x="800" y="92" text-anchor="middle" class="sub">A reconstructed and clarified continuation of RP9_apx 091</text>

  <!-- inherited geometry -->
  <rect x="55" y="125" width="770" height="720" rx="18" class="panel"/>
  <text x="425" y="168" text-anchor="middle" class="h">INHERITED GEOMETRIC STRUCTURE</text>
  <g clip-path="url(#circleClip)">
    <rect x="165" y="240" width="130" height="520" class="xfill" opacity=".62"/>
    <rect x="295" y="240" width="260" height="520" class="yfill" opacity=".55"/>
    <rect x="555" y="240" width="130" height="520" class="xfill" opacity=".62"/>
  </g>
  <rect x="165" y="240" width="520" height="520" class="shape"/>
  <circle cx="425" cy="500" r="260" class="shape"/>
  <circle cx="425" cy="500" r="130" class="inner"/>
  <line x1="165" y1="500" x2="685" y2="500" class="shape"/>
  <line x1="425" y1="240" x2="425" y2="760" stroke="#64748b" stroke-width="2"/>
  <line x1="295" y1="205" x2="295" y2="790" class="guide"/><line x1="555" y1="205" x2="555" y2="790" class="guide"/>
  <circle cx="425" cy="500" r="10" class="center"/>
  <text x="445" y="530" class="h">C = 0</text>
  <line x1="425" y1="500" x2="609" y2="316" stroke="#7c3aed" stroke-width="5" marker-end="url(#rArrow)"/>
  <text x="525" y="390" class="math" fill="#7c3aed">R</text>
  <g text-anchor="middle">
    <text x="230" y="450" class="math teal">X</text><text x="230" y="485" class="math">1/4 = 2/8</text>
    <text x="425" y="420" class="math gold">Y</text><text x="425" y="455" class="math">1/2 = 4/8</text>
    <text x="620" y="450" class="math teal">X</text><text x="620" y="485" class="math">1/4 = 2/8</text>
  </g>
  <rect x="135" y="785" width="580" height="42" rx="12" class="lock"/>
  <text x="425" y="813" text-anchor="middle" class="math">2/8 + 4/8 + 2/8 = 8/8</text>

  <!-- quotient operation -->
  <rect x="855" y="125" width="690" height="720" rx="18" class="panel"/>
  <text x="1200" y="168" text-anchor="middle" class="h">QUOTIENT / COMPLEMENTARY REGROUPING</text>
  <text x="1200" y="214" text-anchor="middle" class="small">The established parts are regrouped; no new value is introduced.</text>
  <g text-anchor="middle">
    <text x="990" y="280" class="math teal">X</text><text x="1200" y="280" class="math gold">Y</text><text x="1410" y="280" class="math teal">X</text>
    <text x="990" y="320" class="math">2/8</text><text x="1200" y="320" class="math">4/8</text><text x="1410" y="320" class="math">2/8</text>
  </g>
  <path d="M955 350 v22 h70 v-22" class="bracket"/>
  <path d="M1155 350 v22 h300 v-22" class="bracket"/>
  <text x="990" y="412" text-anchor="middle" class="math">2/8</text>
  <text x="1305" y="412" text-anchor="middle" class="math">4/8 + 2/8 = 6/8</text>
  <text x="1200" y="475" text-anchor="middle" class="math">2/8 + 6/8 = 8/8</text>
  <text x="1200" y="522" text-anchor="middle" class="math">↓</text>
  <rect x="980" y="548" width="440" height="82" rx="14" class="lock"/>
  <text x="1200" y="584" text-anchor="middle" class="math">1/4 + 3/4 = 1</text>
  <text x="1200" y="614" text-anchor="middle" class="small">the differentiated complementary relation</text>
  <text x="1200" y="685" text-anchor="middle" class="h">SAME IDENTITY THROUGH THREE SCALES</text>
  <text x="1200" y="732" text-anchor="middle" class="math">1 : 3</text>
  <text x="1200" y="772" text-anchor="middle" class="math">= 1/4 : 3/4</text>
  <text x="1200" y="812" text-anchor="middle" class="math">= 2/8 : 6/8</text>

  <!-- six-position expansion -->
  <rect x="55" y="875" width="1490" height="175" rx="18" class="panel"/>
  <text x="800" y="913" text-anchor="middle" class="h">SIX VISIBLE POSITIONS · SAME COMPLETE VALUE</text>
  <g transform="translate(180 940)">
    <rect width="260" height="64" class="xfill"/><rect x="260" width="130" height="64" class="eighth"/><rect x="390" width="130" height="64" class="yfill"/><rect x="520" width="130" height="64" class="eighth"/><rect x="650" width="130" height="64" class="yfill"/><rect x="780" width="260" height="64" class="xfill"/>
    <rect width="1040" height="64" fill="none" stroke="#0f172a" stroke-width="4"/>
    <g text-anchor="middle" class="t"><text x="130" y="40">1/4</text><text x="325" y="40">1/8</text><text x="455" y="40">1/8</text><text x="585" y="40">1/8</text><text x="715" y="40">1/8</text><text x="910" y="40">1/4</text></g>
  </g>
  <text x="1330" y="969" text-anchor="middle" class="math">= 1</text>
  <text x="1330" y="1002" text-anchor="middle" class="small">2 quarters + 4 eighths</text>
  <text x="800" y="1034" text-anchor="middle" class="small">The center and radius preserve the originating geometry while binary scaling increases the number of visible positions.</text>
  <text x="800" y="1082" text-anchor="middle" class="sub">OPERATION → DIFFERENTIATION → REGROUPING → COMPLEMENTARY RELATION → CONTINUED BINARY SCALING</text>
</svg>
