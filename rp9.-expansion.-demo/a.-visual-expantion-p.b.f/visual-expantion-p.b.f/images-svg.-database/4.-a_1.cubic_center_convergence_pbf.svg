/><path d="M1090 500 L1047.75 309.55" stroke="#536e86" stroke-width="1.7" stroke-dasharray="5 5"/><path d="M1090 500 L1132.25 690.45" stroke="#536e86" stroke-width="1.7" stroke-dasharray="5 5"/><path d="M1090 500 L1132.25 475.95000000000005" stroke="#536e86" stroke-width="1.7" stroke-dasharray="5 5"/><path d="M1090 500 L1242.75 586.45" stroke="#536e86" stroke-width="1.7" stroke-dasharray="5 5"/><path d="M1090 500 L1242.75 371.95000000000005" stroke="#536e86" stroke-width="1.7" stroke-dasharray="5 5"/><path d="M1145.25 448.0 L1090 500" stroke="#9171c4" stroke-width="3"/><circle cx="1145.25" cy="448.0" r="5" fill="#9171c4"/><path d="M992.5 468.8 L1090 500" stroke="#429dcc" stroke-width="3"/><circle cx="992.5" cy="468.8" r="5" fill="#429dcc"/><path d="M1090.0 607.25 L1090 500" stroke="#df9d34" stroke-width="3"/><circle cx="1090.0" cy="607.25" r="5" fill="#df9d34"/><path d="M1187.5 531.2 L1090 500" stroke="#dc647c" stroke-width="3"/><circle cx="1187.5" cy="531.2" r="5" fill="#dc647c"/><path d="M1034.75 552.0 L1090 500" stroke="#45af9b" stroke-width="3"/><circle cx="1034.75" cy="552.0" r="5" fill="#45af9b"/><path d="M1090.0 392.75 L1090 500" stroke="#5c78d4" stroke-width="3"/><circle cx="1090.0" cy="392.75" r="5" fill="#5c78d4"/><circle cx="1090" cy="500" r="15" fill="white" stroke="#18334d" stroke-width="3"/><text x="1090" y="507" text-anchor="middle" class="label" font-weight="700">C</text><rect x="770" y="791" width="17" height="17" rx="3" fill="#9171c4"/><text x="797" y="805" class="small">BACK PYRAMID</text><rect x="985" y="791" width="17" height="17" rx="3" fill="#429dcc"/><text x="1012" y="805" class="small">LEFT PYRAMID</text><rect x="1200" y="791" width="17" height="17" rx="3" fill="#df9d34"/><text x="1227" y="805" class="small">BOTTOM PYRAMID</text><rect x="770" y="829" width="17" height="17" rx="3" fill="#dc647c"/><text x="797" y="843" class="small">RIGHT PYRAMID</text><rect x="985" y="829" width="17" height="17" rx="3" fill="#45af9b"/><text x="1012" y="843" class="small">FRONT PYRAMID</text><rect x="1200" y="829" width="17" height="17" rx="3" fill="#5c78d4"/><text x="1227" y="843" class="small">TOP PYRAMID</text><text x="800" y="760" class="label">Every square base lies on an outer cube face.</text><text x="800" y="730" class="label">All six pyramid apices coincide at C.</text><line x1="80" y1="880" x2="1520" y2="880" stroke="#d2dfec"/><text x="800" y="927" text-anchor="middle" class="formula">6 × (1/3 × a² × a/2) = a³ = ONE COMPLETE CUBE</text></svg>