<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><title>45-degree pyramid section and six-pyramid cube</title><desc>A true central section perpendicular to a base edge has two 45-degree base angles. Six square pyramids fill a cube with their apices at its center and bases on its six outer faces.</desc><rect width="1600" height="1000" fill="#f2f7fc"/><rect x="40" y="40" width="1520" height="920" rx="24" fill="white" stroke="#d2dfec"/><style>text{font-family:Arial,sans-serif;fill:#18334d}.title{font-size:34px;font-weight:700}.head{font-size:22px;font-weight:700}.label{font-size:19px}.small{font-size:16px}.formula{font-size:25px;font-weight:700}</style><text x="85" y="110" class="title">CUBIC CENTER-CONVERGENCE P.B.F.</text><text x="85" y="150" class="label">Six outer square bases · six pyramids · one common apex at the cube center</text><line x1="80" y1="185" x2="1520" y2="185" stroke="#d2dfec"/><line x1="670" y1="220" x2="670" y2="850" stroke="#d2dfec"/><text x="365" y="245" text-anchor="middle" class="head">TRUE 2D CENTRAL SECTION</text><text x="365" y="280" text-anchor="middle" class="small">Section perpendicular to a square-base edge</text><path d="M145 620 L585 620 L365 400 Z" fill="#49a2cb" fill-opacity=".2" stroke="#277ca6" stroke-width="3"/><path d="M365 400 V620" stroke="#536e86" stroke-dasharray="7 6" stroke-width="2"/><path d="M365 603 H382 V620" fill="none" stroke="#536e86" stroke-width="2"/><path d="M195 620 A50 50 0 0 0 180.355 584.645 M535 620 A50 50 0 0 1 549.645 584.645" fill="none" stroke="#de9b26" stroke-width="3"/><text x="208" y="601" class="formula">45°</text><text x="470" y="601" class="formula">45°</text><circle cx="365" cy="400" r="7" fill="#18334d"/><text x="365" y="370" text-anchor="middle" class="label">C — cube center / pyramid apex</text><text x="390" y="510" class="label">h = a/2</text><text x="255" y="654" text-anchor="middle" class="label">a/2</text><text x="475" y="654" text-anchor="middle" class="label">a/2</text><text x="365" y="698" text-anchor="middle" class="label">Square-base section: width a</text><text x="365" y="760" text-anchor="middle" class="formula">tan θ = (a/2)/(a/2) = 1</text><text x="365" y="800" text-anchor="middle" class="formula">θ = 45°</text><text x="1090" y="245" text-anchor="middle" class="head">COMPLETE CUBE — SIX PYRAMIDS</text><text x="1090" y="280" text-anchor="middle" class="small">Transparent parallel projection</text><polygon points="1047.75,524.05 1242.75,586.45 1242.75,371.95 1047.75,309.55" fill="#9171c4" fill-opacity=".13" stroke="#9171c4" stroke-width="2"/><polygon points="1047.75,524.05 1242.75,586.45 1090.00,500.00" fill="#9171c4" fill-opacity=".055"/><polygon points="1242.75,586.45 1242.75,371.95 1090.00,500.00" fill="#9171c4" fill-opacity=".055"/><polygon points="1242.75,371.95 1047.75,309.55 1090.00,500.00" fill="#9171c4" fill-opacity=".055"/><polygon points="1047.75,309.55 1047.75,524.05 1090.00,500.00" fill="#9171c4" fill-opacity=".055"/><polygon points="937.25,628.05 1047.75,524.05 1047.75,309.55 937.25,413.55" fill="#429dcc" fill-opacity=".13" stroke="#429dcc" stroke-width="2"/><polygon points="937.25,628.05 1047.75,524.05 1090.00,500.00" fill="#429dcc" fill-opacity=".055"/><polygon points="1047.75,524.05 1047.75,309.55 1090.00,500.00" fill="#429dcc" fill-opacity=".055"/><polygon points="1047.75,309.55 937.25,413.55 1090.00,500.00" fill="#429dcc" fill-opacity=".055"/><polygon points="937.25,413.55 937.25,628.05 1090.00,500.00" fill="#429dcc" fill-opacity=".055"/><polygon points="937.25,628.05 1132.25,690.45 1242.75,586.45 1047.75,524.05" fill="#df9d34" fill-opacity=".13" stroke="#df9d34" stroke-width="2"/><polygon points="937.25,628.05 1132.25,690.45 1090.00,500.00" fill="#df9d34" fill-opacity=".055"/><polygon points="1132.25,690.45 1242.75,586.45 1090.00,500.00" fill="#df9d34" fill-opacity=".055"/><polygon points="1242.75,586.45 1047.75,524.05 1090.00,500.00" fill="#df9d34" fill-opacity=".055"/><polygon point