<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1400" viewBox="0 0 1400 1400">
<defs>
  <radialGradient id="bg" cx="50%" cy="50%" r="72%">
    <stop offset="0%" stop-color="#08233a"/>
    <stop offset="58%" stop-color="#041525"/>
    <stop offset="100%" stop-color="#010812"/>
  </radialGradient>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="softglow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="2.2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    .node { fill:#eef6ff; font-family: Georgia, "Times New Roman", serif; font-weight:700; }
    .small { fill:#eef6ff; font-family: Georgia, "Times New Roman", serif; }
  </style>
</defs>

<rect width="1400" height="1400" fill="url(#bg)"/>

