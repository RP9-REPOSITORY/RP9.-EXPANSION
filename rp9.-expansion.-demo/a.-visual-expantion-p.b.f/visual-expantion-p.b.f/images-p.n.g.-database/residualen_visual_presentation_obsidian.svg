<svg xmlns="http://www.w3.org/2000/svg" width="980" height="680" viewBox="0 0 980 680">
  <rect x="0" y="0" width="980" height="680" fill="white"/>

  <!-- Title -->
  <text x="490" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#000">
    Non Approximation Acceptance — Absolut Klarhet
  </text>
  <text x="490" y="68" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#222">
    Alla vägar: 01 → {+, −, ×, ÷, π, √, φ, Fₙ} → 10 reducerar till normalformen 10.
  </text>

  <!-- Legend -->
  <g>
    <rect x="220" y="88" width="540" height="28" rx="6" ry="6" fill="#fafafa" stroke="#c8c8c8"/>
    <circle cx="248" cy="102" r="7" fill="white" stroke="black" stroke-width="1.5"/>
    <text x="262" y="107" font-family="Georgia, serif" font-size="12">Portar (01, 10)</text>
    <rect x="385" y="95" width="14" height="14" fill="white" stroke="black" stroke-width="1.5"/>
    <text x="405" y="107" font-family="Georgia, serif" font-size="12">Operationer (+, −, ×, ÷, √)</text>
    <polygon points="610,102 617,95 624,102 617,109" fill="white" stroke="black" stroke-width="1.5"/>
    <text x="636" y="107" font-family="Georgia, serif" font-size="12">Konstanter (π, φ, Fₙ)</text>
  </g>

  <!-- Main coordinates -->
  <!-- nodes x positions -->
  <!-- left 0.08 => 112; center 0.5 => 490; right 0.92 => 868 -->
  <!-- y positions -->
  <!-- operators/constants -->
  <!-- connectors -->
  <g stroke="#555" stroke-width="1.2" opacity="0.35">
    <line x1="112" y1="340" x2="490" y2="164"/>
    <line x1="490" y1="164" x2="868" y2="340"/>

    <line x1="112" y1="340" x2="490" y2="236"/>
    <line x1="490" y1="236" x2="868" y2="340"/>

    <line x1="112" y1="340" x2="490" y2="308"/>
    <line x1="490" y1="308" x2="868" y2="340"/>

    <line x1="112" y1="340" x2="490" y2="380"/>
    <line x1="490" y1="380" x2="868" y2="340"/>

    <line x1="112" y1="340" x2="490" y2="452"/>
    <line x1="490" y1="452" x2="868" y2="340"/>

    <line x1="112" y1="340" x2="490" y2="540"/>
    <line x1="490" y1="540" x2="868" y2="340"/>

    <line x1="112" y1="340" x2="490" y2="612"/>
    <line x1="490" y1="612" x2="868" y2="340"/>
  </g>

  <!-- Residual annotation -->
  <text x="490" y="132" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#555">
    εₚ = (C₃ + C₁₀) − (C₀ + C₁) = 0.203820426377  (&gt; 0 ⇒ bias mot ”10”)
  </text>

  <!-- Ports -->
  <g>
    <circle cx="112" cy="340" r="28" fill="white" stroke="black" stroke-width="2"/>
    <text x="112" y="346" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold">01</text>
    <text x="112" y="385" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">mikroport / källa</text>
    <text x="112" y="402" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">(cirkeln, magnetisk potential,</text>
    <text x="112" y="418" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">icke-manifesterat)</text>

    <circle cx="868" cy="340" r="28" fill="white" stroke="black" stroke-width="2"/>
    <text x="868" y="346" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold">10</text>
    <text x="868" y="385" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">ytterport / manifestation</text>
    <text x="868" y="402" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">(linjen, elektrisk riktning,</text>
    <text x="868" y="418" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">manifesterat)</text>
  </g>

  <!-- Operations -->
  <g>
    <rect x="478" y="152" width="24" height="24" fill="white" stroke="black" stroke-width="1.5"/>
    <text x="490" y="169" text-anchor="middle" font-family="Georgia, serif" font-size="18">+</text>

    <rect x="478" y="224" width="24" height="24" fill="white" stroke="black" stroke-width="1.5"/>
    <text x="490" y="241" text-anchor="middle" font-family="Georgia, serif" font-size="18">−</text>

    <rect x="478" y="296" width="24" height="24" fill="white" stroke="black" stroke-width="1.5"/>
    <text x="490" y="313" text-anchor="middle" font-family="Georgia, serif" font-size="18">×</text>

    <rect x="478" y="368" width="24" height="24" fill="white" stroke="black" stroke-width="1.5"/>
    <text x="490" y="385" text-anchor="middle" font-family="Georgia, serif" font-size="18">÷</text>

    <rect x="478" y="440" width="24" height="24" fill="white" stroke="black" stroke-width="1.5"/>
    <text x="490" y="458" text-anchor="middle" font-family="Georgia, serif" font-size="18">π</text>

    <rect x="478" y="528" width="24" height="24" fill="white" stroke="black" stroke-width="1.5"/>
    <text x="490" y="546" text-anchor="middle" font-family="Georgia, serif" font-size="18">√</text>

    <polygon points="490,600 502,612 490,624 478,612" fill="white" stroke="black" stroke-width="1.5"/>
    <text x="490" y="617" text-anchor="middle" font-family="Georgia, serif" font-size="16">φ</text>

    <polygon points="560,600 572,612 560,624 548,612" fill="white" stroke="black" stroke-width="1.5"/>
    <text x="560" y="617" text-anchor="middle" font-family="Georgia, serif" font-size="14">Fₙ</text>
  </g>

  <!-- Labels for operations / constants -->
  <g font-family="Georgia, serif" font-size="12" fill="#333">
    <text x="520" y="167">Plus: x → x + y</text>
    <text x="520" y="239">Minus: x → x − y</text>
    <text x="520" y="311">Multiplikation: x → x × y</text>
    <text x="520" y="383">Division: x → x ÷ y</text>
    <text x="520" y="455">Pi: π ≈ 3.141592653589793</text>
    <text x="520" y="543">Kvadratroten: x → √x</text>
    <text x="590" y="607">Gyllene snittet: φ = (1+√5)/2 ≈ 1.61803398875</text>
    <text x="590" y="624">Fibonacci: F₀=0, F₁=1, Fₙ=Fₙ₋₁+Fₙ₋₂</text>
  </g>

  <!-- Explanatory box -->
  <g>
    <rect x="32" y="508" width="360" height="128" rx="6" ry="6" fill="rgba(255,255,255,0.95)" stroke="black" stroke-width="1.2"/>
    <text x="50" y="536" font-family="Georgia, serif" font-size="16" font-weight="bold">Residualsatsen (ε-axiomet):</text>
    <text x="50" y="562" font-family="Georgia, serif" font-size="14">εₚ är icke-eliminerbar (fysiskt låst).</text>
    <text x="50" y="586" font-family="Georgia, serif" font-size="14">Policy kan styra utfall, men fundamentet ligger fast.</text>
    <text x="50" y="622" font-family="Georgia, serif" font-size="14">Normalform: Alla kedjor ⇒ <tspan font-weight="bold">10</tspan>.</text>
  </g>
</svg>
