<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">2B. Planar Bidirectional L-P.B.F.</title>
  <desc id="description">Two mirrored L-based staircase executions extend from one common center through opposite planar directions. Each branch preserves the X-X-Y positional order. The branches are directional representations of the same P.B.F. function and are not added together.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eaf2fb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9" result="blur"/>
      <feOffset in="blur" dx="0" dy="7" result="offsetBlur"/>
      <feColorMatrix in="offsetBlur" type="matrix" values="0 0 0 0 0.075  0 0 0 0 0.14  0 0 0 0 0.23  0 0 0 0.16 0" result="shadowColor"/>
      <feMerge>
        <feMergeNode in="shadowColor"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow-right" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#244768"/>
    </marker>
    <marker id="arrow-left" viewBox="0 0 12 12" refX="2" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 12 0 L 0 6 L 12 12 z" fill="#244768"/>
    </marker>
    <style>
      .title { font: 700 42px Inter, Arial, sans-serif; fill: #13243a; letter-spacing: 1px; }
      .subtitle { font: 500 21px Inter, Arial, sans-serif; fill: #49657f; }
      .stage { font: 700 18px Inter, Arial, sans-serif; fill: #49657f; letter-spacing: 1.6px; }
      .white { font: 800 25px Inter, Arial, sans-serif; fill: #ffffff; }
      .smallWhite { font: 700 16px Inter, Arial, sans-serif; fill: #ffffff; }
      .centerMain { font: 800 33px Inter, Arial, sans-serif; fill: #ffffff; }
      .centerSmall { font: 700 14px Inter, Arial, sans-serif; fill: #ffffff; letter-spacing: 0.8px; }
      .caption { font: 500 18px Inter, Arial, sans-serif; fill: #314e69; }
      .small { font: 600 16px Inter, Arial, sans-serif; fill: #49657f; }
      .formula { font: 800 24px Inter, Arial, sans-serif; fill: #13243a; letter-spacing: 1.2px; }
      .angle { font: 800 20px Inter, Arial, sans-serif; fill: #d65353; }
      .boundary { font: 700 16px Inter, Arial, sans-serif; fill: #244768; letter-spacing: 0.35px; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <rect x="55" y="45" width="1490" height="810" rx="30" fill="#ffffff" stroke="#c8d8e8" stroke-width="2" filter="url(#shadow)"/>

  <text x="100" y="120" class="title">2B. PLANAR BIDIRECTIONAL L-P.B.F.</text>
  <text x="100" y="160" class="subtitle">One common center · two mirrored L-based staircase executions · one preserved function</text>
  <line x1="100" y1="220" x2="1500" y2="220" stroke="#d8e4ef" stroke-width="2"/>

  <text x="460" y="272" text-anchor="middle" class="stage">LEFT PLANAR EXECUTION</text>
  <text x="800" y="272" text-anchor="middle" class="stage">COMMON CENTER</text>
  <text x="1140" y="272" text-anchor="middle" class="stage">RIGHT PLANAR EXECUTION</text>

  <!-- Mirrored staircase paths. Execution begins at the center and moves outward. -->
  <path d="M 750 340 H 650 V 420 H 505 V 500 H 315 V 580 H 205"
        fill="none" stroke="#244768" stroke-width="10" stroke-linejoin="round" marker-end="url(#arrow-left)"/>
  <path d="M 850 340 H 950 V 420 H 1095 V 500 H 1285 V 580 H 1395"
        fill="none" stroke="#244768" stroke-width="10" stroke-linejoin="round" marker-end="url(#arrow-right)"/>

  <!-- Center. -->
  <g transform="translate(750 290)" filter="url(#shadow)">
    <circle cx="50" cy="50" r="50" fill="#d65353"/>
    <text x="50" y="48" text-anchor="middle" class="centerMain">I</text>
    <text x="50" y="72" text-anchor="middle" class="centerSmall">CENTER</text>
  </g>

  <!-- Left branch, read from center outward: X, X, Y. -->
  <g transform="translate(585 370)">
    <rect width="90" height="90" rx="15" fill="#35b9cf"/>
    <text x="45" y="40" text-anchor="middle" class="white">X</text>
    <text x="45" y="67" text-anchor="middle" class="smallWhite">1/4</text>
  </g>
  <g transform="translate(440 450)">
    <rect width="90" height="90" rx="15" fill="#35b9cf"/>
    <text x="45" y="40" text-anchor="middle" class="white">X</text>
    <text x="45" y="67" text-anchor="middle" class="smallWhite">1/4</text>
  </g>
  <g transform="translate(250 530)">
    <rect width="120" height="90" rx="15" fill="#e6a52c"/>
    <text x="60" y="40" text-anchor="middle" class="white">Y</text>
    <text x="60" y="67" text-anchor="middle" class="smallWhite">1/2</text>
  </g>

  <!-- Right branch, read from center outward: X, X, Y. -->
  <g transform="translate(925 370)">
    <rect width="90" height="90" rx="15" fill="#35b9cf"/>
    <text x="45" y="40" text-anchor="middle" class="white">X</text>
    <text x="45" y="67" text-anchor="middle" class="smallWhite">1/4</text>
  </g>
  <g transform="translate(1070 450)">
    <rect width="90" height="90" rx="15" fill="#35b9cf"/>
    <text x="45" y="40" text-anchor="middle" class="white">X</text>
    <text x="45" y="67" text-anchor="middle" class="smallWhite">1/4</text>
  </g>
  <g transform="translate(1230 530)">
    <rect width="120" height="90" rx="15" fill="#e6a52c"/>
    <text x="60" y="40" text-anchor="middle" class="white">Y</text>
    <text x="60" y="67" text-anchor="middle" class="smallWhite">1/2</text>
  </g>

  <text x="800" y="430" text-anchor="middle" class="angle">MIRRORED 90° TURNS</text>

  <text x="460" y="650" text-anchor="middle" class="caption">CENTER → X → X → Y</text>
  <text x="1140" y="650" text-anchor="middle" class="caption">CENTER → X → X → Y</text>

  <g transform="translate(270 685)">
    <rect width="1060" height="70" rx="17" fill="#f4f8fc" stroke="#bfd1e2" stroke-width="2"/>
    <text x="530" y="31" text-anchor="middle" class="formula">Y — X — X  ←  CENTER  →  X — X — Y</text>
    <text x="530" y="55" text-anchor="middle" class="small">Mirrored planar direction · preserved P.B.F. positional identity</text>
  </g>

  <line x1="100" y1="785" x2="1500" y2="785" stroke="#d8e4ef" stroke-width="2"/>
  <text x="800" y="818" text-anchor="middle" class="boundary">THE MIRRORED L-STAIRCASES ARE TWO PLANAR DIRECTIONS OF THE SAME FUNCTION · THEY DO NOT FORM TWO NEW FUNCTIONS</text>
</svg>
