<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">1B. Linear Bidirectional P.B.F.</title>
  <desc id="description">The established X-X-Y positional sequence is executed from one common center through two opposite linear directions. The mirrored branches are directional representations of the same function and are not added together.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eaf2fb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9" result="blur"/>
      <feOffset in="blur" dx="0" dy="7" result="offsetBlur"/>
      <feColorMatrix in="offsetBlur" type="matrix" values="0 0 0 0 0.075  0 0 0 0 0.14  0 0 0 0 0.23  0 0 0 0.16 0" result="shadowColor"/>
      <feMerge>
        <feMergeNode in="shadowColor"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow-right" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#244768"/>
    </marker>
    <marker id="arrow-left" viewBox="0 0 12 12" refX="2" refY="6" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M 12 0 L 0 6 L 12 12 z" fill="#244768"/>
    </marker>
    <style>
      .title { font: 700 42px Inter, Arial, sans-serif; fill: #13243a; letter-spacing: 1px; }
      .subtitle { font: 500 21px Inter, Arial, sans-serif; fill: #49657f; }
      .stage { font: 700 18px Inter, Arial, sans-serif; fill: #49657f; letter-spacing: 1.7px; }
      .value { font: 800 30px Inter, Arial, sans-serif; fill: #ffffff; }
      .fraction { font: 700 21px Inter, Arial, sans-serif; fill: #ffffff; }
      .centerMain { font: 800 34px Inter, Arial, sans-serif; fill: #ffffff; }
      .centerSmall { font: 700 15px Inter, Arial, sans-serif; fill: #ffffff; letter-spacing: 1px; }
      .caption { font: 500 19px Inter, Arial, sans-serif; fill: #314e69; }
      .small { font: 600 17px Inter, Arial, sans-serif; fill: #49657f; }
      .formula { font: 800 25px Inter, Arial, sans-serif; fill: #13243a; letter-spacing: 2px; }
      .boundary { font: 700 17px Inter, Arial, sans-serif; fill: #244768; letter-spacing: 0.5px; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <rect x="55" y="45" width="1490" height="810" rx="30" fill="#ffffff" stroke="#c8d8e8" stroke-width="2" filter="url(#shadow)"/>

  <text x="100" y="120" class="title">1B. LINEAR BIDIRECTIONAL P.B.F.</text>
  <text x="100" y="160" class="subtitle">One established sequence · one common center · two opposite execution directions</text>
  <line x1="100" y1="225" x2="1500" y2="225" stroke="#d8e4ef" stroke-width="2"/>

  <text x="420" y="285" text-anchor="middle" class="stage">LEFTWARD EXECUTION</text>
  <text x="800" y="285" text-anchor="middle" class="stage">COMMON CENTER</text>
  <text x="1180" y="285" text-anchor="middle" class="stage">RIGHTWARD EXECUTION</text>

  <line x1="715" y1="430" x2="205" y2="430" stroke="#244768" stroke-width="6" marker-end="url(#arrow-left)"/>
  <line x1="885" y1="430" x2="1395" y2="430" stroke="#244768" stroke-width="6" marker-end="url(#arrow-right)"/>

  <g transform="translate(750 380)" filter="url(#shadow)">
    <circle cx="50" cy="50" r="50" fill="#d65353"/>
    <text x="50" y="48" text-anchor="middle" class="centerMain">I</text>
    <text x="50" y="73" text-anchor="middle" class="centerSmall">CENTER</text>
  </g>

  <!-- Left branch: execution order from center is X, X, Y. -->
  <g transform="translate(580 365)">
    <rect width="105" height="130" rx="16" fill="#35b9cf"/>
    <text x="52.5" y="57" text-anchor="middle" class="value">X</text>
    <text x="52.5" y="91" text-anchor="middle" class="fraction">1/4</text>
  </g>
  <g transform="translate(445 365)">
    <rect width="105" height="130" rx="16" fill="#35b9cf"/>
    <text x="52.5" y="57" text-anchor="middle" class="value">X</text>
    <text x="52.5" y="91" text-anchor="middle" class="fraction">1/4</text>
  </g>
  <g transform="translate(260 365)">
    <rect width="155" height="130" rx="16" fill="#e6a52c"/>
    <text x="77.5" y="57" text-anchor="middle" class="value">Y</text>
    <text x="77.5" y="91" text-anchor="middle" class="fraction">1/2</text>
  </g>

  <!-- Right branch: execution order from center is X, X, Y. -->
  <g transform="translate(915 365)">
    <rect width="105" height="130" rx="16" fill="#35b9cf"/>
    <text x="52.5" y="57" text-anchor="middle" class="value">X</text>
    <text x="52.5" y="91" text-anchor="middle" class="fraction">1/4</text>
  </g>
  <g transform="translate(1050 365)">
    <rect width="105" height="130" rx="16" fill="#35b9cf"/>
    <text x="52.5" y="57" text-anchor="middle" class="value">X</text>
    <text x="52.5" y="91" text-anchor="middle" class="fraction">1/4</text>
  </g>
  <g transform="translate(1185 365)">
    <rect width="155" height="130" rx="16" fill="#e6a52c"/>
    <text x="77.5" y="57" text-anchor="middle" class="value">Y</text>
    <text x="77.5" y="91" text-anchor="middle" class="fraction">1/2</text>
  </g>

  <text x="420" y="545" text-anchor="middle" class="caption">Same functional order · opposite reading direction</text>
  <text x="1180" y="545" text-anchor="middle" class="caption">Same functional order · opposite reading direction</text>

  <g transform="translate(270 610)">
    <rect width="1060" height="96" rx="18" fill="#f4f8fc" stroke="#bfd1e2" stroke-width="2"/>
    <text x="530" y="42" text-anchor="middle" class="formula">Y — X — X  ←  CENTER  →  X — X — Y</text>
    <text x="530" y="73" text-anchor="middle" class="small">Direction changes · the P.B.F. positional identity remains unchanged</text>
  </g>

  <line x1="100" y1="765" x2="1500" y2="765" stroke="#d8e4ef" stroke-width="2"/>
  <text x="800" y="804" text-anchor="middle" class="boundary">THE TWO BRANCHES REPRESENT TWO DIRECTIONS OF THE SAME FUNCTION · THEIR VALUES ARE NOT ADDED TOGETHER</text>
</svg>
